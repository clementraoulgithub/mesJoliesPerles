<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bijoux fantaisie colorés, faits main dans la région nantaise depuis 2017. Boutiques Etsy et Un grand marché, marchés de créateurs et de Noël." />

    <!-- Link previews (WhatsApp, Facebook, iMessage, LinkedIn…). %SITE_URL% is filled in at build time (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Les-jolies-perles" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Les-jolies-perles · Bijoux fantaisie faits main" />
    <meta property="og:description" content="Bijoux fantaisie colorés, faits main dans la région nantaise depuis 2017. Boutiques Etsy et Un grand marché, marchés de créateurs et de Noël." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Les-jolies-perles : boucles d’oreilles en résine faites main" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2b1f1a" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Structured data for Google: who the maker is, where to buy, social profiles -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Les-jolies-perles",
        "description": "Bijoux fantaisie colorés, faits main dans la région nantaise depuis 2017 : boucles d’oreilles en résine, acétate, perles. Créations sur commande sans supplément.",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/marque/logo.jpeg",
        "image": "%SITE_URL%/og-image.jpg",
        "foundingDate": "2017",
        "areaServed": "FR",
        "address": { "@type": "PostalAddress", "addressLocality": "Nantes", "addressRegion": "Pays de la Loire", "addressCountry": "FR" },
        "aggregateRating": { "@type": "AggregateRating", "ratingValue": "5.0", "reviewCount": "483", "bestRating": "5" },
        "sameAs": [
          "https://www.etsy.com/fr/shop/Mesjoliesperles",
          "https://www.ungrandmarche.fr/boutique/les-jolies-perles",
          "https://www.instagram.com/les_joliesperles/",
          "https://www.facebook.com/Les-jolies-perles-1657622727841765/",
          "https://www.pinterest.fr/raphallegdmt/"
        ]
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;600&display=swap" />
    <title>Les-jolies-perles · Bijoux fantaisie faits main</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
